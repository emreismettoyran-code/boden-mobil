<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boden Mobil - Mesai</title><script src="config.js"></script><style>body{margin:0;background:#eee;font:14px Arial;color:#222}.bar{background:#444;color:#fff;padding:12px;font-weight:bold}.wrap{max-width:1200px;margin:auto;padding:8px}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.nav button{padding:10px 14px;border:1px solid #777;background:#ddd;font-weight:bold}.nav button.active{background:#aaa}.panel{background:#f8f8f8;border:1px solid #777;padding:10px;margin-bottom:8px}.grid{display:grid;grid-template-columns:140px 1fr 140px 1fr;gap:7px;align-items:center}.inp{box-sizing:border-box;width:100%;padding:7px;border:1px solid #888}.wide{grid-column:2/5}.btn{padding:8px 14px;border:1px solid #777;background:#ddd;font-weight:bold}.actions{text-align:right;margin-top:8px}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;background:#fff}.tbl th,.tbl td{border:1px solid #888;padding:6px;text-align:left;vertical-align:top}.tbl th{background:#d2d2d2}.person{cursor:pointer}.person.sel{background:#bdd5e9}.status{font-size:12px;background:#ddd;padding:6px}@media(max-width:700px){.grid{grid-template-columns:105px 1fr}.wide{grid-column:2}.tbl{min-width:900px}}@media print{.nav,.actions,.status{display:none}.panel{border:0}.bar{color:#000;background:#fff}}</style></head><body><div class="bar">BODEN MOBİL — PERSONEL MESAİ</div><div class="wrap"><div class="nav"><button onclick="location.href='index.html'">BODEN ÖLÇÜ</button><button class="active">PERSONEL MESAİ</button></div><div class="panel"><b>PERSONEL LİSTESİ</b><div class="tablewrap"><table class="tbl"><thead><tr><th>Adı</th><th>Soyadı</th><th>Sicil</th><th>Görevi</th></tr></thead><tbody id="people"></tbody></table></div></div><div class="panel"><b>FAZLA ÇALIŞMA / MESAİ GİRİŞİ</b><div class="grid" style="margin-top:8px"><label>Personel</label><input id="person" class="inp" readonly><label>Tarih</label><input id="date" class="inp" type="date"><label>Başlangıç</label><input id="start" class="inp" type="time"><label>Bitiş</label><input id="end" class="inp" type="time"><label>Mola (dk)</label><input id="break" class="inp" type="number" value="0"><label>Mesai Türü</label><select id="type" class="inp"><option>Fazla Çalışma</option><option>Hafta Tatili</option><option>Resmî Tatil</option><option>Gece Çalışması</option></select><label>Mesai Nedeni / Yapılan İş</label><textarea id="reason" class="inp wide" rows="4" placeholder="Mesai sırasında yapılan işlemleri yazınız"></textarea></div><div class="actions"><button class="btn" onclick="clearForm()">Temizle</button> <button class="btn" onclick="saveRecord()">Mesaiyi Kaydet</button></div></div><div class="panel"><b>SEÇİLİ PERSONELİN MESAİ GEÇMİŞİ</b><div class="tablewrap"><table class="tbl"><thead><tr><th>Tarih</th><th>Tür</th><th>Baş.</th><th>Bit.</th><th>Süre</th><th>Mesai Nedeni / Yapılan İş</th></tr></thead><tbody id="history"></tbody></table></div></div><div class="status" id="status">Merkezi veri hazırlanıyor...</div></div><script>const API=window.BODEN_API_BASE.replace(/\/$/,''),PK='mesai_people',RK='mesai_records';let people=[],records=[],sel=null;const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);async function get(k){let r=await fetch(API+'/state/'+encodeURIComponent(k),{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();return j.value}async function put(k,v){let r=await fetch(API+'/state/'+encodeURIComponent(k),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:JSON.stringify(v)})});if(!r.ok)throw Error(await r.text())}function localFallback(){try{people=JSON.parse(localStorage.getItem(PK)||'[]')}catch{}try{records=JSON.parse(localStorage.getItem(RK)||'[]')}catch{}}async function load(){localFallback();try{let p=await get(PK),r=await get(RK);if(p)people=JSON.parse(p);if(r)records=JSON.parse(r);else if(records.length)await put(RK,records);if(people.length===0&&people.length===0){$('status').textContent='Merkezi veri bağlı';}else $('status').textContent='Merkezi veri bağlı';}catch(e){$('status').textContent='Merkezi veri bağlantı hatası';}if(!sel&&people[0])sel=people[0].id;render();}function render(){let rows=$('people');rows.innerHTML=people.map(p=>`<tr class="person ${p.id===sel?'sel':''}" onclick="selectP('${p.id}')"><td>${esc(p.firstName)}</td><td>${esc(p.lastName)}</td><td>${esc(p.sicil)}</td><td>${esc(p.job)}</td></tr>`).join('')||'<tr><td colspan="4">Personel bulunamadı</td></tr>';let p=people.find(x=>x.id===sel);$('person').value=p?[p.firstName,p.lastName].filter(Boolean).join(' '):'';let rs=records.filter(r=>r.personId===sel).sort((a,b)=>b.date.localeCompare(a.date));$('history').innerHTML=rs.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.start)}</td><td>${esc(r.end)}</td><td>${duration(r.start,r.end,r.breakMin)}</td><td>${esc(r.reason||'')}</td></tr>`).join('')||'<tr><td colspan="6">Kayıt yok</td></tr>'}function selectP(id){sel=id;render()}function duration(a,b,m){if(!a||!b)return'';let x=a.split(':').map(Number),y=b.split(':').map(Number),n=y[0]*60+y[1]-x[0]*60-x[1]-Number(m||0);if(n<0)n+=1440;return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}async function saveRecord(){if(!sel)return alert('Personel seçiniz.');if(!$('date').value||!$('start').value||!$('end').value)return alert('Tarih, başlangıç ve bitiş giriniz.');let r={id:Date.now().toString(36),personId:sel,date:$('date').value,start:$('start').value,end:$('end').value,breakMin:Number($('break').value||0),type:$('type').value,reason:$('reason').value.trim(),createdAt:new Date().toISOString()};records.push(r);try{await put(RK,records);localStorage.setItem(RK,JSON.stringify(records));$('status').textContent='Mesai merkezi veriye kaydedildi.';clearForm();render()}catch(e){records.pop();alert('Merkezi kayıt yapılamadı: '+e.message)}}function clearForm(){$('date').value=today();$('start').value='';$('end').value='';$('break').value=0;$('reason').value=''}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('date').value=today();load();</script></body></html>

name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK bileşenleri
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2 indir
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
      - name: APK oluştur
        working-directory: android
        run: ../gradle-8.10.2/bin/gradle --no-daemon assembleDebug
      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Boden-Olcu-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK bileşenleri
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android projesini doğrula
        working-directory: android
        run: |
          set -euxo pipefail
          gradle --version
          gradle --no-daemon --stacktrace tasks

      - name: APK oluştur
        working-directory: android
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: APK dosyasını doğrula
        run: |
          set -euxo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Boden-Olcu-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

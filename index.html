<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Boden Ölçü"><link rel="manifest" href="manifest.webmanifest"><title>Boden Ölçü</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0f7;background:#07101c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07101c,#101b2b);min-height:100vh}header{padding:18px 16px 14px;background:#081321;border-bottom:1px solid #263448;position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#91a1b5;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#111d2d;border:1px solid #2a3a50;border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}label{display:block;font-size:12px;color:#a8b6c8;margin:0 0 6px}input{width:100%;height:48px;border:1px solid #33465f;border-radius:12px;background:#0b1524;color:#fff;padding:0 13px;font-size:16px;outline:none}.title{font-size:15px;font-weight:700;margin-bottom:12px}.measure{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:10px}.wheel{font-weight:700;padding-bottom:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{height:48px;border:0;border-radius:12px;font-weight:700;font-size:15px}.primary{background:#2d74da;color:#fff}.secondary{background:#223249;color:#dbe7f5}.danger{background:#8f2f3d;color:#fff}.records{display:flex;flex-direction:column;gap:10px}.record{border:1px solid #304258;border-radius:13px;padding:12px;background:#0d1827}.record small{display:block;color:#94a5ba;margin-top:4px}.vals{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pill{background:#17263a;border-radius:8px;padding:8px;text-align:center;font-size:12px}.empty{color:#8394aa;text-align:center;padding:16px}.hint{color:#8294a9;font-size:12px}.install{display:none;background:#17365c;border:1px solid #376ba9;border-radius:12px;padding:11px;margin-bottom:14px;font-size:13px}</style></head><body><header><h1>Boden Ölçü</h1><p>TCDD Teknik bakım ve ölçü kayıt sistemi</p></header><main class="wrap"><div id="install" class="install">Uygulamayı telefonuna ana ekrana eklemek için buraya dokun.</div><section class="card"><div class="title">Kayıt Bilgileri</div><div class="grid"><div><label>Tarih</label><input id="date" type="date"></div><div><label>Lokomotif No</label><input id="loco" inputmode="numeric" placeholder="Örn. 68000"></div></div></section><section class="card"><div class="title">Boden Ölçüleri</div><div id="measures"></div><div class="actions"><button class="btn secondary" onclick="addRow()">+ Ölçü Satırı</button><button class="btn primary" onclick="saveRecord()">Kaydet</button></div><p class="hint">Her lokomotif için ölçüleri ayrı kaydedebilirsin.</p></section><section class="card"><div class="title">Geçmiş Kayıtlar</div><div id="records" class="records"></div></section></main><script>const $=x=>document.getElementById(x);let rows=0;function today(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}function addRow(){rows++;let d=document.createElement('div');d.className='measure';d.innerHTML='<div class="wheel">Teker '+rows+'</div><div><label>İlk ölçü</label><input class="m1" inputmode="decimal" placeholder="mm"></div><div><label>Son ölçü</label><input class="m2" inputmode="decimal" placeholder="mm"></div>';$('measures').appendChild(d)}function data(){return JSON.parse(localStorage.getItem('bodenRecords')||'[]')}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function saveRecord(){let loco=$('loco').value.trim();if(!loco){alert('Lokomotif numarasını girin.');return}let measurements=[...document.querySelectorAll('.measure')].map((r,i)=>({teker:i+1,ilk:r.querySelector('.m1').value.trim(),son:r.querySelector('.m2').value.trim()})).filter(x=>x.ilk||x.son);if(!measurements.length){alert('En az bir ölçü girin.');return}let a=data();a.unshift({id:Date.now(),date:$('date').value,loco,measurements});localStorage.setItem('bodenRecords',JSON.stringify(a));$('loco').value='';document.querySelectorAll('.m1,.m2').forEach(x=>x.value='');render();alert('Kayıt kaydedildi.')}function del(id){localStorage.setItem('bodenRecords',JSON.stringify(data().filter(x=>x.id!==id)));render()}function render(){let a=data();$('records').innerHTML=a.length?a.map(r=>'<div class="record"><b>Loko '+esc(r.loco)+'</b><small>'+esc(r.date)+' · '+r.measurements.length+' ölçü</small><div class="vals">'+r.measurements.map(m=>'<div class="pill">T'+m.teker+'<br>'+esc(m.ilk||'-')+' / '+esc(m.son||'-')+'</div>').join('')+'</div><button class="btn danger" style="width:100%;height:38px;margin-top:9px" onclick="del('+r.id+')">Kaydı Sil</button></div>').join(''):'<div class="empty">Henüz kayıt yok.</div>'}$('date').value=today();for(let i=0;i<6;i++)addRow();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='block';$('install').onclick=()=>{deferred.prompt();deferred=null}});</script></body></html>
